            animation: float 6s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: float 7s ease-in-out infinite -2s;
        }
        .animate-float-slow {
            animation: float 9s ease-in-out infinite -4s;
        }
        body {
            scroll-behavior: smooth;
        }
